# Built-in themes. Every theme is nine colour tokens:
#   background  window and canvas
#   surface     header bar, sidebar, status bar, menus
#   text        primary text and icons
#   accent      selection, focus rings, active controls
#   danger      errors
#   muted       disabled and subtle fills
#   highlight   hover and selected fills
#   border      hairlines
#   dim_text    secondary text

themes:
