    name: "Catppuccin Mocha"
    background: "#1e1e2e"
    surface: "#181825"
    text: "#cdd6f4"
    accent: "#89b4fa"
    danger: "#f38ba8"
    muted: "#313244"
    highlight: "#313244"
    border: "#45475a"
