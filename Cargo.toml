[package]
name = "previewer"
version = "0.1.0"
edition = "2024"
description = "A fast, themeable image viewer for Linux, inspired by macOS Preview"
license = "MIT"

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_12"] }
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "ico", "jpeg", "png", "pnm", "qoi", "tga", "tiff", "webp", "hdr", "exr"] }
resvg = { version = "0.48", default-features = false, features = ["text", "system-fonts"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml_ng = "0.10"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
